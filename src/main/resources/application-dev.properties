spring.application.name=Smart Wallet Application

# Base configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/smart_wallet_app_may_2026?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345
logging.level.org.hibernate.persister.entity=ERROR

spring.mvc.hiddenmethod.filter.enabled=true
notification-svc-base-url=http://localhost:8081/api/v1/notifications
notification.service.api-key=${API_KEY}

# Schedulers
spring.task.scheduling.pool.size=2
#spring.threads.virtual.enabled = true